[package]
workspace = "../../native-candidate"
name = "meerkat-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Meerkat Connect's standalone terminal and reusable native setup conversation"
publish = false

[[bin]]
name = "toolkit_gateway"
path = "src/bin/toolkit_gateway.rs"
required-features = ["console"]

[features]
default = []
console = ["dep:meerkat-mobkit", "dep:meerkat-mob", "dep:axum"]

[dependencies]
axum = { version = "0.8", optional = true }
meerkat-authorization-contracts = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-mob = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", optional = true }
meerkat-mobkit = { package = "meerkat-meta", git = "https://github.com/lukacf/meerkat-meta.git", rev = "669f54fafafd82747c8cd9022e602a774cb4559d", optional = true }
meerkat = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", features = ["local-authorization", "session-store", "mcp", "skills", "native-keyring"] }
meerkat-core = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-runtime = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-session = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-store = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", features = ["sqlite", "jsonl"] }
meerkat-models = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-llm-core = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", default-features = false }
meerkat-auth-core = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-openai = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", default-features = false }
meerkat-anthropic = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", default-features = false, features = ["oauth"] }
meerkat-gemini = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", default-features = false, features = ["oauth"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
toolkit-package = { path = "../toolkit-package", default-features = false }
meerkat-toolkit = { path = "../meerkat-toolkit" }
nix = { version = "=0.31.3", features = ["signal", "process", "term", "poll", "fs", "user"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
async-trait.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "cookies"] }
cookie = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
toolkit-mobkit = { path = "../toolkit-mobkit", features = ["native-host"] }

[dev-dependencies]
# Native fault controls are available only to this crate's tests.
meerkat = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", features = ["test-support"] }
meerkat-authorization = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-client = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-mob = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hmac = "0.12"
base64 = "0.22"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

[[test]]
name = "mobkit_setup_member"
required-features = ["console"]
