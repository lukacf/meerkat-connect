# Pending native integration. See README.md before selecting this workspace.
[workspace]
members = ["../crates/meerkat-connect", "../crates/toolkit-catalog", "../crates/meerkat-toolkit", "../crates/toolkit-mobkit"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
toolkit-package = { path = "../crates/toolkit-package" }
toolkit-store = { path = "../crates/toolkit-store" }
toolkit-catalog = { path = "../crates/toolkit-catalog" }
meerkat-toolkit = { path = "../crates/meerkat-toolkit" }
indexmap = "2"
# Development integration against the isolated upstream prerequisite changes.
# Distribution requires a published or immutable Git dependency containing them.
meerkat = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05", default-features = false }
meerkat-machine-dsl = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-machine-schema = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-machine-codegen = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-core = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-llm-core = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-authorization = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-authorization-contracts = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-runtime = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-workgraph = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-tools = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }

meerkat-mob = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-mob-mcp = { git = "https://github.com/lukacf/meerkat.git", rev = "efd313d44807d3e93f6808a127fa157be84dee05" }
meerkat-mobkit = { package = "meerkat-meta", git = "https://github.com/lukacf/meerkat-meta.git", rev = "669f54fafafd82747c8cd9022e602a774cb4559d" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1

